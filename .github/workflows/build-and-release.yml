name: Build, Test and Release libpurecrypt

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Crypto Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcrypt-dev

      - name: Run Test Suite
        run: make test

  build:
    name: Build Library & Kernel Module
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip

      - name: Build static library and kernel module
        run: |
          make all CROSS=
          make module CROSS=

      - name: Package distribution artifacts
        id: package
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="nightly-${SHORT_SHA}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Prepare staging directory
          mkdir -p dist/include dist/lib dist/modules
          cp include/*.h dist/include/
          cp build/libpurecrypt.a dist/lib/
          cp build/modules/crypt.elf dist/modules/
          cp build/modules/crypt.ko dist/modules/
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/

          # Create archives
          tar -czvf "libpurecrypt-${VERSION}.tar.gz" -C dist .
          (cd dist && zip -r "../libpurecrypt-${VERSION}.zip" .)

          # Compute SHA-256 checksums
          sha256sum "libpurecrypt-${VERSION}.tar.gz" \
                    "libpurecrypt-${VERSION}.zip" \
                    dist/lib/libpurecrypt.a \
                    dist/modules/crypt.elf \
                    dist/modules/crypt.ko > SHA256SUMS.txt

          # Collect all release files in a flat folder
          mkdir -p release_assets
          cp "libpurecrypt-${VERSION}.tar.gz" release_assets/
          cp "libpurecrypt-${VERSION}.zip" release_assets/
          cp dist/lib/libpurecrypt.a release_assets/
          cp dist/modules/crypt.elf release_assets/
          cp dist/modules/crypt.ko release_assets/
          cp SHA256SUMS.txt release_assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpurecrypt-artifacts
          path: release_assets/*
          retention-days: 14

  release:
    name: Publish Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: libpurecrypt-artifacts
          path: release_assets

      - name: Determine release parameters
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="libpurecrypt ${TAG_NAME}"
            IS_PRERELEASE="false"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="nightly-${SHORT_SHA}"
            RELEASE_NAME="libpurecrypt Nightly (${SHORT_SHA})"
            IS_PRERELEASE="true"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body: |
            ## Automated Release: ${{ steps.vars.outputs.release_name }}

            ### Status
            - **FIPS 180-4 SHA-512 Tests**: PASSED
            - **SHA512-crypt ($6$) glibc crypt_r Differential Tests**: PASSED
            - **Commit**: ${{ github.sha }}

            ### Release Assets:
            - `libpurecrypt.a`: Freestanding static library (no libc, no malloc, integer-only)
            - `crypt.elf` / `crypt.ko`: Relocatable kernel modules for PureC OS
            - `libpurecrypt-*.tar.gz`: Full archive with headers, static library, and modules
            - `libpurecrypt-*.zip`: ZIP archive distribution
            - `SHA256SUMS.txt`: SHA-256 checksums of all binaries
          files: release_assets/*
          draft: false
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}

